name: Run all cypress tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  cypress-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Avoid persisting the default GITHUB_TOKEN as a git credential header for github.com;
          # it would override our app-token URL rewrite used for private deps like levante-swr.
          persist-credentials: false

      - name: Generate token
        id: generate_token
        uses: tibdex/github-app-token@v1
        with:
          app_id: ${{ secrets.LEVANTE_BOT_APP_ID }}
          private_key: ${{ secrets.LEVANTE_BOT_APP_PRIVATE_KEY }}

      # Private git dependencies (e.g. levante-swr) are locked to SSH URLs; runners have no SSH key.
      - name: Authenticate Git for private dependencies
        env:
          GH_APP_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          git config --global url."https://x-access-token:${GH_APP_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://x-access-token:${GH_APP_TOKEN}@github.com/".insteadOf "git@github.com:"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm install

      - name: Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: ./node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Run cypress tests (exclude locales)
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          start: npm run dev:db
          wait-on: 'http://localhost:5173'
          wait-on-timeout: 120

        env:
          E2E_USE_ENV: 'TRUE'
          E2E_BASE_URL: 'http://localhost:5173/login'
          VITE_HTTPS: 'FALSE'
          E2E_TEST_EMAIL: ${{ secrets.PARTICIPANT_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.PARTICIPANT_PASSWORD }}

  cypress-locales-emulator:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci

      - name: Run locales login against emulator (HTTP)
        run: bash scripts/e2e-locales-emulator.sh
