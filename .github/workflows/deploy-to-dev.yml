name: Deploy to development
'on':
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Avoid persisting the default GITHUB_TOKEN as a git credential header for github.com;
          # it would override our app-token URL rewrite used for private deps like levante-swr.
          persist-credentials: false
      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.LEVANTE_BOT_APP_ID }}
          private-key: ${{ secrets.LEVANTE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      # Private git dependencies (e.g. levante-swr) are locked to SSH URLs; runners have no SSH key.
      - name: Authenticate Git for private dependencies
        env:
          GH_APP_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          git config --global url."https://x-access-token:${GH_APP_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://x-access-token:${GH_APP_TOKEN}@github.com/".insteadOf "git@github.com:"
      - uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          check-latest: true
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - name: 'Build'
        env:
          NODE_OPTIONS: '--max_old_space_size=8192'
          VITE_SURVEYJS_LICENSE_KEY: ${{ secrets.VITE_SURVEYJS_LICENSE_KEY }}
        run: npm ci && npm run build:dev
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV_ADMIN }}'
          channelId: live
          projectId: '${{ secrets.FIREBASE_PROJECT }}'
          target: production
      - name: Create Sentry release and upload source maps
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: levante-framework-eu
          SENTRY_PROJECT: dashboard
        with:
          environment: production
          projects: dashboard qa
          sourcemaps: ./dist/assets/*.js.map
          version: ${{ github.ref_name }}-${{ github.sha }}
