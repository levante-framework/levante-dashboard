name: i18n-and-build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate token
        id: generate_token
        uses: tibdex/github-app-token@v1
        with:
          app_id: ${{ secrets.LEVANTE_BOT_APP_ID }}
          private_key: ${{ secrets.LEVANTE_BOT_APP_PRIVATE_KEY }}

      # Private git dependencies (e.g. levante-swr) are locked to SSH URLs; runners have no SSH key.
      - name: Authenticate Git for private dependencies
        env:
          GH_APP_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          git config --global url."https://x-access-token:${GH_APP_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://x-access-token:${GH_APP_TOKEN}@github.com/".insteadOf "git@github.com:"

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Install deps
        run: npm ci

      - name: Download translations from Crowdin (optional)
        if: env.CROWDIN_API_TOKEN != ''
        env:
          CROWDIN_API_TOKEN: ${{ secrets.CROWDIN_API_TOKEN }}
        run: npm run i18n:crowdin:download

      - name: CSV → JSON
        run: npm run i18n:csv-to-json

      - name: Validate CSVs
        run: npm run i18n:validate

      - name: Build
        run: npm run build:dev

      # Optional Cypress smoke (headless) - only on PRs; never on deployment
      - name: Cypress locales smoke
        if: ${{ false }}
        env:
          E2E_USE_ENV: 'TRUE'
          E2E_BASE_URL: ${{ env.E2E_BASE_URL }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: |
          npx cypress run --e2e --spec "cypress/e2e/locales.cy.ts"
